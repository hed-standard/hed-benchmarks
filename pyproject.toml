[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hedbench"
version = "0.1.0"
description = "Benchmark case studies and shared benchmark tooling for HED annotation and analysis."
readme = "README.md"
authors = [
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
    { name = "Daria Agafonova", email = "agafonovadaria97@gmail.com" },
]
maintainers = [
    { name = "Kay Robbins", email = "Kay.Robbins@utsa.edu" },
]
license = { text = "MIT" }
keywords = ["HED", "hierarchical event descriptors", "benchmarks", "neuroscience", "BIDS", "events", "annotation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.10"

dependencies = [
    # The search benchmark needs hed.models.string_search and
    # hed.models.schema_lookup, which are newer than the released hedtools on
    # PyPI. Switch to a normal version pin at the next hedtools release.
    "hedtools @ git+https://github.com/hed-standard/hed-python.git@main",
    "jsonschema>=4.21.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.3,<4.0.0",
]

[project.urls]
"Homepage" = "https://www.hedtags.org/"
"Documentation" = "https://www.hedtags.org/hed-benchmarks/"
"Repository" = "https://github.com/hed-standard/hed-benchmarks/"
"Bug Tracker" = "https://github.com/hed-standard/hed-benchmarks/issues"
"HED Resources" = "https://www.hedtags.org/hed-resources/"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "typos>=1.29.0",
    "mdformat>=0.7.0",
    "mdformat-myst>=0.1.5",
]
test = [
    "pytest>=8.0.0",
]
docs = [
    "sphinx>=7.1.0,<10.0",
    "furo>=2024.1.29",
    "sphinx-copybutton>=0.5.2",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=3.0.0,<3.12.1",
    "linkify-it-py>=2.0.3",
]

[tool.setuptools.packages.find]
where = [""]
include = ["hedbench*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.typos.files]
extend-exclude = [
    "*.json",
    "*.tsv",
    "*.toml",
    # Vendored test data and machine-generated example results
    # (committed, but not authored prose)
    "use_cases/*/example/",
]

[tool.typos.default.extend-words]
# Domain-specific terms that are not typos
hed = "hed"

[tool.ruff]
# Target Python 3.10+
target-version = "py310"
line-length = 120

# Exclude common directories
exclude = [
    '.git',
    '.venv',
    'venv',
    '__pycache__',
    'build',
    'dist',
    '*.egg-info',
    '.status',
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by ruff format
    "N802",  # camelCase test methods (legacy convention)
    "N803",  # non-lowercase argument names (scientific code)
    "N806",  # non-lowercase variables in functions (scientific code)
]

# __init__.py files: unused imports are re-exports, and their import order is
# curated by hand to avoid circular imports - isort must not reorder them.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["hedbench"]
combine-as-imports = true

[tool.ruff.format]
# Ruff format settings
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
