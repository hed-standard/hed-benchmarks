---
name: Mdformat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mdformat:
    name: Markdown formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Run mdformat (check only)
        # Generated benchmark reports under use_cases/*/example/ are committed
        # but machine-written, so they are excluded from the formatting check.
        run: git ls-files -z '*.md' ':!use_cases/*/example/**' | xargs -0 uvx --with mdformat-myst mdformat --check
